services:
  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME}
      MYSQL_USER: ${DB_USER:?Set DB_USER}
      MYSQL_PASSWORD: ${DB_PASS:?Set DB_PASS}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:?Set DB_ROOT_PASS}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  minio:
    image: myweb-minio:release20251015
    pull_policy: never
    build:
      context: ..
      dockerfile: deploy/minio.Dockerfile
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:19001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--noproxy", "*", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30
  backend:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      API_URL: /api
      BASE_API_URL: http://localhost
      SPRING_DATASOURCE_HIKARI_JDBC_URL: jdbc:mysql://db:3306/${DB_NAME}?serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_HIKARI_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_HIKARI_PASSWORD: ${DB_PASS}
      SPRING_SQL_INIT_MODE: never
      SPRING_MAIL_USERNAME: ${MAIL_USER:-}
      SPRING_MAIL_PASSWORD: ${MAIL_PASS:-}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
      MINIO_ENDPOINT: http://minio
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--noproxy", "*", "-fsS", "http://127.0.0.1:8080/api/board/board-list?searchCondition=all&searchKeyword=&page=0"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
  frontend:
    build:
      context: ../frontend
      target: production
      args:
        REACT_APP_API_URL: /api
        REACT_APP_FILE_BASE_URL: ${PUBLIC_FILE_BASE_URL:-/storage/mywebbucket/}
        REACT_APP_FRONT_URL: ${REACT_APP_FRONT_URL:-}
        REACT_APP_BACK_URL: ${REACT_APP_BACK_URL:-}
        REACT_APP_KAKAO_REST_API: ${REACT_APP_KAKAO_REST_API:-}
        REACT_APP_GOOGLE_REST_API: ${REACT_APP_GOOGLE_REST_API:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8088}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  db-data:
  minio-data:
